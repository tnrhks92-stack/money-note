<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가계부 노트</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가계부 노트">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F6F2E8">
<style>
  html,body{margin:0;height:100%;background:#F6F2E8}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  .wait{position:fixed;inset:0;display:grid;place-items:center;text-align:center;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#2E3A33;padding:24px}
  .wait img{width:96px;height:96px;border-radius:24px;box-shadow:0 8px 24px rgba(50,90,70,.25)}
  .wait p{margin:16px 0 0;font-size:15px}
  .wait a{display:inline-block;margin-top:18px;padding:12px 20px;border-radius:999px;background:#4F8F6E;color:#fff;text-decoration:none;font-weight:700}
  .wait a[hidden]{display:none}
</style>
</head>
<body>
<div class="wait" id="wait">
  <div>
    <img src="icon-192.png" alt="">
    <p>가계부 노트를 여는 중이에요…</p>
    <a id="open" hidden>여기를 눌러 열기</a>
  </div>
</div>
<script src="config.js"></script>
<script>
  /* 웹앱 주소는 config.js 에 따로 있어요. 이 파일은 고치지 않고 그대로 올리면 됩니다. */
  var APP_URL = String(window.APP_URL || '').trim();
  /* 주소가 겹치거나, 배포 ID만 넣거나, 끝에 /exec 가 없어도 알아서 바로잡음 */
  var ids = APP_URL.match(/AKfy[A-Za-z0-9_-]{20,}/g) || APP_URL.match(/[A-Za-z0-9_-]{40,}/g);
  if (ids) APP_URL = 'https:\/\/script.google.com/macros/s/' + ids[ids.length - 1] + '/exec';
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(APP_URL)) {
    document.getElementById('wait').innerHTML = '<div><p>config.js 파일에 웹앱 주소가 아직 없어요.</p></div>';
    throw new Error('APP_URL 없음');
  }

  var open = document.getElementById('open');
  open.href = APP_URL;
  var f = document.createElement('iframe');
  f.src = APP_URL;
  f.title = '가계부 노트';
  f.allow = 'clipboard-write; web-share; fullscreen';
  f.onload = function(){ document.getElementById('wait').style.display = 'none'; };
  document.body.appendChild(f);
  setTimeout(function(){ open.hidden = false; }, 6000);
  /* 자동 로그인: 가계부 앱이 보낸 로그인 정보를 이 페이지(내 휴대폰)에 보관했다가 다음에 열 때 돌려줌 */
  var KEY = 'ledger-login';
  function saved(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ return {}; } }
  window.addEventListener('message', function(e){
    if (!/\.googleusercontent\.com$/.test(e.origin)) return;
    var m = e.data || {};
    if (m.t === 'ledger-ready') {
      var s = saved();
      e.source.postMessage({ t: 'ledger-hello', token: s.token || '', me: s.me, names: s.names || null }, e.origin);
    } else if (m.t === 'ledger-save') {
      var s2 = saved();
      if (m.token) s2.token = m.token; else delete s2.token;
      if (m.me != null) s2.me = m.me;
      if (m.names) s2.names = m.names;
      try { localStorage.setItem(KEY, JSON.stringify(s2)); } catch(err){}
    }
  });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
